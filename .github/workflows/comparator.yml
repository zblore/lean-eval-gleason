# Checks the proof the way lean-eval does. Comparator builds Solution inside a landrun sandbox,
# checks it proves the same statement as Challenge with only the permitted axioms, and nanoda
# replays it through a second, independent kernel. The tool pins match lean-eval's
# submission workflow (leanprover/lean-eval-submissions, .github/workflows/submission.yml).
name: Comparator

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comparator:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      # Only the Mathlib cache. Comparator must be the first thing to build Solution.
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          use-mathlib-cache: true
          use-github-cache: false
          build: false
          test: false
          lint: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.25.12'
          cache: false

      - name: Install landrun
        run: |
          go install github.com/zouuup/landrun/cmd/landrun@5ed4a3db3a4ad930d577215c6b9abaa19df7f99f
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build lean4export
        run: |
          set -euo pipefail
          git clone https://github.com/leanprover/lean4export.git "$RUNNER_TEMP/lean4export"
          cd "$RUNNER_TEMP/lean4export"
          git checkout 076e8e57707e813375e8f9da8bf989799ace9680
          cp "$GITHUB_WORKSPACE/lean-toolchain" lean-toolchain
          lake build lean4export
          echo "$PWD/.lake/build/bin" >> "$GITHUB_PATH"

      - name: Build comparator
        run: |
          set -euo pipefail
          git clone https://github.com/leanprover/comparator.git "$RUNNER_TEMP/comparator"
          cd "$RUNNER_TEMP/comparator"
          git checkout d03acab154d269c06e60e4de7e4cc85deebff94b
          lake build comparator
          echo "$PWD/.lake/build/bin" >> "$GITHUB_PATH"

      - name: Build nanoda
        run: |
          set -euo pipefail
          git clone https://github.com/robsimmons/nanoda_lib.git "$RUNNER_TEMP/nanoda"
          cd "$RUNNER_TEMP/nanoda"
          git checkout 68d5ca9db226849b41a6fff59d796ff19d0a8840
          cargo build --release
          echo "$PWD/target/release" >> "$GITHUB_PATH"

      # WorkspaceTest.lean is lean-eval's harness. It turns nanoda on and runs comparator.
      - name: Run comparator with nanoda
        run: lake test

      - name: Print axioms
        run: lake env lean audit/Axioms.lean
